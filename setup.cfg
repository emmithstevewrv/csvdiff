[metadata]
name = csvdiff
version = 0.1.0
description = Fast column-aware diff tool for large CSV files with configurable key columns.
long_description = file: README.md
long_description_content_type = text/markdown
author = csvdiff contributors
license = MIT
python_requires = >=3.11

[options]
packages = find:
include_package_data = True

[options.entry_points]
console_scripts =
    csvdiff = csvdiff.cli:main

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov

[tool:pytest]
testpaths = tests
addopts = -v --tb=short

[flake8]
max-line-length = 99
exclude = .git,__pycache__,.venv
